version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/node
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 7
