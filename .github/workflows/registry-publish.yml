name: registry-publish

# Publishes server.json to the MCP Registry (registry.modelcontextprotocol.io).
#
# Uses GitHub Actions OIDC: the workflow authenticates as this repository's
# owner (the Massed-Compute org), which grants the io.github.Massed-Compute/*
# namespace without depending on any individual account's org-membership
# visibility. Run manually after a release whose server.json should become
# the registry's current listing.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # nosemgrep: github-actions-mutable-action-tag
      - name: Install mcp-publisher
        # Release assets are named with Go arch conventions (amd64, arm64) —
        # not uname -m's x86_64 — so the arch is pinned to the runner's.
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Publish server.json to the MCP Registry
        run: mcp-publisher publish
